<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Ventas Diarias</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>

<body>

    <main class="card" aria-labelledby="table-title">

        <header class="card-header">
            <h1 id="table-title" class="table-title">Resumen de Ventas Diarias</h1>
        </header>

        <div class="card-body">

            <div class="toolbar">

                <div class="table-container" role="region" aria-label="Resumen de Ventas Diarias" tabindex="0">

                    <table>
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Cantidad de ventas</th>
                                <th>Unidades vendidas</th>
                                <th>Ingresos</th>
                                <th>Ticket promedio</th>
                                <th>Última actualización</th>
                            </tr>
                        </thead>

                        <tbody id="table-body">
                        </tbody>

                    </table>

                </div>

                <div class="table-footer"></div>

            </div>

        </div>

    </main>

    <script src="../JS/resumen.js"></script>

</body>
</html>
