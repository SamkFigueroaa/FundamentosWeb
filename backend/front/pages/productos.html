
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>

<body>

    <main class="card" aria-labelledby="table-title">

        <header class="card-header">
            <h1 class="table-title">Listado de Productos</h1>
        </header>

        <div class="card-body">

            <div class="toolbar">

                <div class="table-container" role="region" aria-label="Productos" tabindex="0">

                    <table>
                        <thead>
                            <tr>
                                <th>ID Producto</th>
                                <th>Nombre</th>
                                <th>Precio de catálogo</th>
                            </tr>
                        </thead>

                        <tbody id="table-body">
                        </tbody>

                    </table>

                </div>

                <div class="table-footer"></div>

            </div>

        </div>

    </main>

    <script src="../JS/Productos.js"></script>

</body>
</html>
